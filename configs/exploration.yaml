  E2_pool_size: 4
  E2_tasks_max: 24
  E2_max_new_tokens: 128
  E3_factorial_tasks_max: 24
  E3_preservation_tasks_max: 16
  E4_tasks_max: 24
  E4_panel_size: 2
  E4_max_new_tokens: 512
  bootstrap_replicates: 2000
  bootstrap_seed: 11252026
caps:
  initial_download_gib: 12
  initial_new_files_gib: 20
  minimum_free_disk_gib: 15
  max_inference_concurrency: 1
  max_runner_concurrency: 1
  P1: {calls: 24, output_tokens: 18432, wall_minutes: 90}
  E1: {calls: 320, output_tokens: 245760, wall_minutes: 480}
  E2: {calls: 96, output_tokens: 12288, wall_minutes: 180}
  E3: {calls: 112, output_tokens: 86016, wall_minutes: 300}
  E4: {calls: 24, output_tokens: 12288, wall_minutes: 180}
sandbox:
  image_digest: null
  memory_mib: 512
  pids_limit: 32
  cpus: 1
  stdout_stderr_max_kib: 64
  tmpfs_mib: 64
  timeout_policy: official_with_hard_safety_cap_to_validate_in_P0

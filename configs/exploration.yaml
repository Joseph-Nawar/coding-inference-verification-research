version: '0.1-proposed'
research_mode: exploratory
authorized_stages: [P0, P1]
confirmation_enabled: false
network_in_runner: false
external_inference: false
model:
  id: mlx-community/Qwen2.5-Coder-3B-Instruct-4bit
  revision: null # resolve and pin in P0
  backend: mlx-lm
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 768
  max_context_tokens: 8192 # validate on local hardware
  seed_namespace: null # private research parameter
  trust_remote_code: false
data:
  benchmarks: [humaneval, mbpp]
  evalplus_release: null # resolve and pin in P0
  split_namespace: null # private research parameter
  smoke_per_benchmark: 4
  dev_per_benchmark: 20
  confirmation_per_benchmark: 40
  diagnostic_max_inputs: 8
  heldout_min_unique_inputs: 8
exploration:
